kind: Pod
apiVersion: v1
metadata:
  name: my-csi-app-inline
spec:
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  containers:
    - name: my-frontend
      image: busybox
      volumeMounts:
      - mountPath: "/data"
        name: my-csi-volume
      command: [ "sleep", "1000000" ]
  volumes:
    - name: my-csi-volume
      csi:
        driver: lvm.csi.metal-stack.io
        volumeAttributes:
          size: "20MB"
          type: "linear"
